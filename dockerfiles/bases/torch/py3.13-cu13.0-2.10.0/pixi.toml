[workspace]
authors = ["Neko Ayaka <neko@ayaka.moe>"]
channels = ["conda-forge"]
name = "env"
platforms = ["linux-64", "linux-aarch64"]
version = "0.1.0"

[tasks]

[dependencies]
# Same Python as the CUDA base. A newer patch release makes Pixi reinstall every
# PyPI package on top of it.
python = "==3.13.9"
pip = ">=25.2,<26"

[target.linux-64.dependencies]
cuda = ">=13.0.2,<14"
cuda-cupti = ">=13.0.85,<14"
cuda-libraries-dev = ">=13.0.2,<14"
cuda-nvcc = ">=13.0.88,<14"
cuda-nvtx = ">=13.0.85,<14"
# Triton compiles a small C launcher for every kernel at runtime and looks for
# `gcc` on PATH. The GCC 15.2 toolchain for nvcc is already here; this adds the name.
gcc = ">=15.2,<15.3"
# `cuda-compiler` depends on an unconstrained `c-compiler`, which resolved to 1.0.0
# (2019) in the 2.9.0 image. Its `bin/gcc` points to a compiler that is not
# installed, and it owns the same path as `gcc`.
c-compiler = ">=1.9"

[target.linux-64.pypi-dependencies]
# 2.10.0 fixes the 3D convolution regression of 2.9 (pytorch/pytorch#166122), which
# LLaMA-Factory refuses to train with for models that have a Conv3d (Qwen3.5 / Qwen3.6).
torch = { version = "==2.10.0", index = "https://download.pytorch.org/whl/cu130" }
torchvision = { version = "==0.25.0", index = "https://download.pytorch.org/whl/cu130" }
